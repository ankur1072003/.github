<svg viewBox="0 0 410 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ankur Kumar milestones">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/><stop offset="1" stop-color="#0D1830"/>
    </linearGradient>
    <clipPath id="touter"><rect width="410" height="230" rx="20"/></clipPath>
    <style>
      @keyframes cellIn2 { from { opacity:0; transform:translateY(14px) scale(.9); } to { opacity:1; transform:translateY(0) scale(1); } }
      .cell { opacity:0; animation:cellIn2 .55s ease forwards; transform-box:fill-box; transform-origin:center; }
      @keyframes shineMove { 0% { transform:translateX(-40px) rotate(20deg);} 100% { transform:translateX(220px) rotate(20deg);} }
      .shine { animation:shineMove 3.6s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#touter)">
    <rect width="410" height="230" fill="url(#tbg)"/>
    <rect width="410" height="230" fill="none" stroke="#22D3EE" stroke-opacity="0.25"/>
    <text x="20" y="26" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#EAF2FF">Milestones</text>
    
  <clipPath id="cellclip0"><rect width="88" height="170" rx="14"/></clipPath>
  <g class="cell" style="animation-delay:0.00s" transform="translate(15.0,40)">
    <rect width="88" height="170" rx="14" fill="#0B1428" fill-opacity="0.7" stroke="#22D3EE" stroke-opacity="0.45"/>
    <polygon points="44,16 50,30 65,31 53,41 57,56 44,48 31,56 35,41 23,31 38,30" fill="#22D3EE" opacity="0.9"/>
    <text x="44" y="92" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#22D3EE">25</text>
    <text x="44" y="122" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8C9BC2">
      <tspan x="44" dy="0">Language</tspan>
      <tspan x="44" dy="14">Markets Shipped</tspan>
    </text>
    <g clip-path="url(#cellclip0)">
      <rect class="shine" x="-30" y="-20" width="16" height="210" fill="#ffffff" opacity="0.12" transform="rotate(20)"/>
    </g>
  </g>
  <clipPath id="cellclip1"><rect width="88" height="170" rx="14"/></clipPath>
  <g class="cell" style="animation-delay:0.15s" transform="translate(113.8,40)">
    <rect width="88" height="170" rx="14" fill="#0B1428" fill-opacity="0.7" stroke="#A855F7" stroke-opacity="0.45"/>
    <polygon points="44,16 50,30 65,31 53,41 57,56 44,48 31,56 35,41 23,31 38,30" fill="#A855F7" opacity="0.9"/>
    <text x="44" y="92" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#A855F7">275+</text>
    <text x="44" y="122" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8C9BC2">
      <tspan x="44" dy="0">Automated</tspan>
      <tspan x="44" dy="14">Posters / Day</tspan>
    </text>
    <g clip-path="url(#cellclip1)">
      <rect class="shine" x="-30" y="-20" width="16" height="210" fill="#ffffff" opacity="0.12" transform="rotate(20)"/>
    </g>
  </g>
  <clipPath id="cellclip2"><rect width="88" height="170" rx="14"/></clipPath>
  <g class="cell" style="animation-delay:0.30s" transform="translate(212.5,40)">
    <rect width="88" height="170" rx="14" fill="#0B1428" fill-opacity="0.7" stroke="#FF3D81" stroke-opacity="0.45"/>
    <polygon points="44,16 50,30 65,31 53,41 57,56 44,48 31,56 35,41 23,31 38,30" fill="#FF3D81" opacity="0.9"/>
    <text x="44" y="92" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#FF3D81">AWS</text>
    <text x="44" y="122" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8C9BC2">
      <tspan x="44" dy="0">Cloud</tspan>
      <tspan x="44" dy="14">Practitioner Certified</tspan>
    </text>
    <g clip-path="url(#cellclip2)">
      <rect class="shine" x="-30" y="-20" width="16" height="210" fill="#ffffff" opacity="0.12" transform="rotate(20)"/>
    </g>
  </g>
  <clipPath id="cellclip3"><rect width="88" height="170" rx="14"/></clipPath>
  <g class="cell" style="animation-delay:0.45s" transform="translate(311.2,40)">
    <rect width="88" height="170" rx="14" fill="#0B1428" fill-opacity="0.7" stroke="#3DFFB0" stroke-opacity="0.45"/>
    <polygon points="44,16 50,30 65,31 53,41 57,56 44,48 31,56 35,41 23,31 38,30" fill="#3DFFB0" opacity="0.9"/>
    <text x="44" y="92" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#3DFFB0">2026</text>
