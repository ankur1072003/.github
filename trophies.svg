      <tspan x="44" dy="0">FIFA</tspan>
      <tspan x="44" dy="14">World Cup Platform</tspan>
    </text>
    <g clip-path="url(#cellclip3)">
      <rect class="shine" x="-30" y="-20" width="16" height="210" fill="#ffffff" opacity="0.12" transform="rotate(20)"/>
    </g>
  </g>
  </g>
</svg>